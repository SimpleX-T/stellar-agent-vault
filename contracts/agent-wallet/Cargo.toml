[package]
name = "agent-wallet"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Native ed25519 signing for driving __check_auth in unit tests (dev/test only,
# never compiled into the wasm).
ed25519-dalek = "2"
